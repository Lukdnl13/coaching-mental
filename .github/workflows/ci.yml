name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable package manager
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/decision.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
